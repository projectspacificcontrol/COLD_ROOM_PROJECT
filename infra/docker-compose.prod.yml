services:
  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    volumes:
      - sqlserver_data:/var/opt/mssql
      - backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
    networks:
      - cold_room_internal

  sqlserver-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      MSSQL_DATABASE: ${MSSQL_DATABASE}
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    command: >
      /bin/bash -c "/opt/mssql-tools18/bin/sqlcmd -S db -U sa -P \"$${MSSQL_SA_PASSWORD}\" -C -Q \"IF DB_ID('$${MSSQL_DATABASE}') IS NULL CREATE DATABASE [$${MSSQL_DATABASE}]\""
    networks:
      - cold_room_internal

  migrate:
    build:
      context: ../services/api
      dockerfile: Dockerfile.prod
    env_file:
      - ../.env
    command: ["python", "-m", "alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
      sqlserver-init:
        condition: service_completed_successfully
    networks:
      - cold_room_internal

  seed:
    build:
      context: ../services/api
      dockerfile: Dockerfile.prod
    env_file:
      - ../.env
    command: ["python", "-m", "app.scripts.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - cold_room_internal

  api:
    build:
      context: ../services/api
      dockerfile: Dockerfile.prod
    restart: unless-stopped
    env_file:
      - ../.env
    depends_on:
      migrate:
        condition: service_completed_successfully
      seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/ready', timeout=5)\""]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - cold_room_internal
      - cold_room_edge

  web:
    build:
      context: ../apps/web
      dockerfile: Dockerfile.prod
      args:
        VITE_API_BASE_URL: /api
        VITE_USE_FIXTURES: "false"
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - cold_room_edge

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - api
      - web
    ports:
      - "80:80"
      - "443:443"
    networks:
      - cold_room_edge

volumes:
  sqlserver_data:
  backups:

networks:
  cold_room_internal:
    internal: true
  cold_room_edge:

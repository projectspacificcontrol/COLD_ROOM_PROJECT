name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api
    env:
      ENVIRONMENT: test
      API_SECRET_KEY: ci-secret-key-with-at-least-twenty-four-chars
      API_ALLOWED_ORIGINS: http://localhost:5173
      API_COOKIE_SECURE: "false"
      API_DEV_FIXTURE_ENABLED: "true"
      API_DATA_PROVIDER: excel_fixture
      API_BOOTSTRAP_ADMIN_EMAIL: admin@example.com
      API_BOOTSTRAP_ADMIN_PASSWORD: ValidPassword123!
      DATABASE_URL: sqlite+aiosqlite:///./ci.db
      PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt ruff pip-audit
      - run: ruff check app tests
      - run: python -m alembic upgrade head
      - run: python -m app.scripts.seed
      - run: pytest tests
      - run: pip-audit --progress-spinner off
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e -- --project=chromium

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f services/api/Dockerfile.prod services/api
      - run: docker build -f apps/web/Dockerfile.prod apps/web
